name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Prepare Pages artifact
        run: |
          cp -R dist _site
          cp .github/pages/pages-isolation.js _site/
          awk '/src="\.\/app\.js"/ { print "  <script src=\"./pages-isolation.js\" defer></script>" } { print }' dist/index.html > _site/index.html
          test "$(grep -c pages-isolation.js _site/index.html)" -eq 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
